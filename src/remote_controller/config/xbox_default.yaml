inputs:
  selection:
    scan_interval_ms: 100
    promote_stable_ms: 500
sources:
  crsf:
    type: crsf
    device: /dev/ttyCRSF
    baud_rate: 460800
    priority: 100
    ready_timeout_ms: 1000
    loss_timeout_ms: 300
    cooldown_ms: 1000
    signals:
      crsf.ch1:
        from: crsf.channel.1
      crsf.ch2:
        from: crsf.channel.2
      crsf.ch3:
        from: crsf.channel.3
      crsf.ch4:
        from: crsf.channel.4
      crsf.ch5:
        from: crsf.channel.5
      crsf.ch6:
        from: crsf.channel.6
      crsf.ch7:
        from: crsf.channel.7
      crsf.ch8:
        from: crsf.channel.8
      crsf.ch9:
        from: crsf.channel.9
      crsf.ch10:
        from: crsf.channel.10
      crsf.ch11:
        from: crsf.channel.11
      crsf.ch12:
        from: crsf.channel.12
      crsf.ch13:
        from: crsf.channel.13
      crsf.ch14:
        from: crsf.channel.14
      crsf.ch15:
        from: crsf.channel.15
      crsf.ch16:
        from: crsf.channel.16
      crsf.connected:
        from: crsf.connected
  gamepad:
    type: joystick
    device: /dev/input/jsBattleDragon
    priority: 50
    ready_timeout_ms: 1000
    loss_timeout_ms: 300
    cooldown_ms: 1000
    signals:
      gamepad.left_y:
        from: js.axis.3
      gamepad.left_x:
        from: js.axis.0
      gamepad.yaw:
        from: js.axis.6
      gamepad.trigger_left:
        from: js.axis.5
      gamepad.trigger_right:
        from: js.axis.4
      gamepad.stop:
        from: js.button.11
      gamepad.start:
        from: js.button.14
      gamepad.lb:
        from: js.button.6
      gamepad.rb:
        from: js.button.7
      gamepad.a:
        from: js.button.0
      gamepad.b:
        from: js.button.1
      gamepad.x:
        from: js.button.3
      gamepad.y:
        from: js.button.4
  keyboard:
    type: keyboard
    priority: 0
    ready_timeout_ms: 1000
    loss_timeout_ms: 300
    cooldown_ms: 1000
    poll_timeout_us: 20000
    hold_ms: 200
    stop: space
    signals:
      keyboard.vx:
        from: keyboard.axis
        negative: s
        positive: w
      keyboard.vy:
        from: keyboard.axis
        negative: d
        positive: a
      keyboard.yaw:
        from: keyboard.axis
        negative: e
        positive: q
      keyboard.normal:
        from: keyboard.key
        key: '1'
        hold_ms: 200
      keyboard.pd_break:
        from: keyboard.key
        key: '!'
      keyboard.recover:
        from: keyboard.key
        key: '2'
      keyboard.dance:
        from: keyboard.key
        key: '3'
      keyboard.amp_run:
        from: keyboard.key
        key: '4'
      keyboard.normal_run:
        from: keyboard.key
        key: '5'
      keyboard.forward_flip:
        from: keyboard.key
        key: '7'
      keyboard.applause:
        from: keyboard.key
        key: '8'
      keyboard.hello:
        from: keyboard.key
        key: '9'
curves:
  stick:
    type: expo
    deadzone: 0.03
    expo: 0.0
    limit:
    - -1.0
    - 1.0
    calibration:
      input:
      - -1.0
      - 0.0
      - 1.0
      output:
      - -1.0
      - 0.0
      - 1.0
controls:
  move.vx:
    type: analog
    mix: max_abs
    sources:
    - source: gamepad.left_y
      direction: -1
      curve: stick
    - source: crsf.ch3
    - source: keyboard.vx
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.03
  move.vy:
    type: analog
    mix: max_abs
    sources:
    - source: gamepad.left_x
      direction: -1
      curve: stick
    - source: crsf.ch4
      direction: -1
    - source: keyboard.vy
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.03
  move.yaw:
    type: analog
    mix: max_abs
    sources:
    - source: gamepad.yaw
      direction: -1
      curve: stick
    - source: crsf.ch1
      direction: -1
    - source: keyboard.yaw
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.05
  system.stop_event:
    type: bool
    source: gamepad.stop
  system.start_event:
    type: bool
    source: gamepad.start
  shoulder.left_event:
    type: bool
    source: gamepad.lb
  shoulder.right_event:
    type: bool
    source: gamepad.rb
  button.a_event:
    type: bool
    source: gamepad.a
  button.b_event:
    type: bool
    source: gamepad.b
  button.x_event:
    type: bool
    source: gamepad.x
  button.y_event:
    type: bool
    source: gamepad.y
  trigger.left_event:
    type: bool
    source: gamepad.trigger_left
    threshold: 0.85
    hysteresis: 0.05
  trigger.right_event:
    type: bool
    source: gamepad.trigger_right
    threshold: 0.85
    hysteresis: 0.05
  crsf.mode:
    type: enum
    source: crsf.ch6
    default: middle
    hysteresis: 0.05
    positions:
      low:
      - -1.0
      - -0.5
      middle:
      - -0.49
      - 0.49
      high:
      - 0.5
      - 1.0
  crsf.connected:
    type: bool
    source: crsf.connected
  crsf.system:
    type: enum
    source: crsf.ch8
    default: middle
    hysteresis: 0.05
    positions:
      low:
      - -1.0
      - -0.5
      middle:
      - -0.49
      - 0.49
      high:
      - 0.5
      - 1.0
  crsf.pd_event:
    type: bool
    source: crsf.ch9
    threshold: 0.5
    hysteresis: 0.05
  keyboard.normal_event:
    type: bool
    source: keyboard.normal
  keyboard.pd_break_event:
    type: bool
    source: keyboard.pd_break
  keyboard.recover_event:
    type: bool
    source: keyboard.recover
  keyboard.dance_event:
    type: bool
    source: keyboard.dance
  keyboard.amp_run_event:
    type: bool
    source: keyboard.amp_run
  keyboard.normal_run_event:
    type: bool
    source: keyboard.normal_run
  keyboard.forward_flip_event:
    type: bool
    source: keyboard.forward_flip
  keyboard.applause_event:
    type: bool
    source: keyboard.applause
  keyboard.hello_event:
    type: bool
    source: keyboard.hello
outputs:
  conflict_policy: first_wins
  publish_on_change: true
  analog:
    vx: move.vx
    vy: move.vy
    yaw: move.yaw
  edge:
  - output: system.stop
    when:
      any:
      - - system.stop_event
      - - crsf.connected
        - crsf.system=low
  - output: system.start
    when:
      any:
      - - system.start_event
      - - crsf.connected
        - crsf.system=high
  level:
  - output: btn_1=1
    when:
      any:
      - - shoulder.right_event
        - button.x_event
      - - keyboard.normal_event
      - - crsf.connected
        - crsf.mode=middle
  - output: btn_2=1
    when:
    - shoulder.right_event
    - button.a_event
  - output: btn_3=1
    when:
      any:
      - - shoulder.right_event
        - button.b_event
      - - keyboard.pd_break_event
      - - crsf.connected
        - crsf.pd_event
  - output: btn_4=1
    when:
      any:
      - - shoulder.right_event
        - button.y_event
      - - crsf.connected
        - crsf.mode=low
  - output: btn_5=1
    when:
      any:
      - - shoulder.left_event
        - button.x_event
      - - keyboard.dance_event
  - output: btn_6=1
    when:
      any:
      - - shoulder.left_event
        - button.a_event
      - - keyboard.recover_event
  - output: btn_7=1
    when:
      any:
      - - shoulder.left_event
        - button.b_event
      - - keyboard.normal_run_event
  - output: btn_8=1
    when:
      any:
      - - shoulder.left_event
        - button.y_event
      - - keyboard.amp_run_event
      - - crsf.connected
        - crsf.mode=high
  - output: btn_9=1
    when:
    - button.x_event
    - released: shoulder.left_event
    - released: shoulder.right_event
    - released: trigger.left_event
    - released: trigger.right_event
  - output: btn_10=2
    when:
      any:
      - - trigger.left_event
        - button.y_event
      - - keyboard.forward_flip_event
  - output: btn_10=4
    when:
      any:
      - - trigger.left_event
        - button.b_event
  - output: btn_10=5
    when:
      any:
      - - trigger.right_event
        - button.b_event
      - - keyboard.applause_event
  - output: btn_10=6
    when:
      any:
      - - trigger.right_event
        - button.a_event
      - - keyboard.hello_event
system:
  start:
  - mkdir -p /var/log/bxi_log
  - ros2 launch bxi_example_py_elf3 example_demo_hw.launch.py > /var/log/bxi_log/$(date
    +%Y-%m-%d_%H-%M-%S)_elf.log 2>&1 &
  - ros2 launch bxi_example_bms bms.launch.py > /var/log/bxi_log/bms_$(date +%Y-%m-%d_%H-%M-%S)_bms.log
    2>&1 &
  - su bxi -c "cd /home/bxi/bxi_ws/bxi_voice && ./bin/bxi-voice" 2>&1 &
  stop:
  - killall -SIGINT hardware_elf3
  - killall -SIGINT bxi_example_py_elf3
  - killall -SIGINT bxi_example_py_elf3_demo
  - killall -SIGINT bxi_bms
  - killall -SIGINT bxi_example_bms
  - killall -SIGINT bxi-voice
system_mutexes:
  robot_process:
    acquire: start
    release: stop
system_reset_motion_after:
- start
- stop
