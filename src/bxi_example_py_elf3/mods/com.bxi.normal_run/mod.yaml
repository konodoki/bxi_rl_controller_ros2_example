schema: 1
id: com.bxi.normal_run
version: 1.0.0
api: 1
entrypoint: plugin:create_mod
events:
  activate: {slot: btn_7, value: 1}
speed_profiles:
  run:
    vx_scale: 2.0
    vx_min: -1.0
    vx_max: 2.0
    vy_scale: 0.5
    yaw_scale: 1.0
states:
  normal_run:
    manifest:
      label: 中速奔跑
      index: 8
      group: Advanced
      icon: directions_run
      confirm: true
      confirm_message: 高速跑步2m/s，没有越障能力
    speed_profile: run
routes:
  - {from: com.bxi.normal/normal, event: activate, to: normal_run, transition: soft_switch}
  - {from: normal_run, event: com.bxi.normal/activate, to: com.bxi.normal/normal, transition: soft_switch}
