schema: 1
id: com.bxi.amp_run
version: 1.0.0
api: 1
entrypoint: plugin:create_mod
events:
  activate: {slot: btn_8, value: 1}
speed_profiles:
  run:
    vx_scale: 4.0
    vx_min: -2.0
    vx_max: 4.0
    vy_scale: 0.5
    yaw_scale: 1.5
states:
  amp_run:
    manifest:
      label: 高速奔跑
      index: 7
      group: Advanced
      icon: sprint
      confirm: true
      confirm_message: 高速跑步4m/s，没有越障能力
    speed_profile: run
routes:
  - {from: com.bxi.normal/normal, event: activate, to: amp_run, transition: soft_switch}
  - {from: amp_run, event: com.bxi.normal/activate, to: com.bxi.normal/normal, transition: soft_switch}
