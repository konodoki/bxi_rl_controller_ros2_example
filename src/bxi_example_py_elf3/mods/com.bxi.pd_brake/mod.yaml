schema: 1
id: com.bxi.pd_brake
version: 1.0.0
api: 1
entrypoint: plugin:create_mod
requires:
  - id: com.bxi.normal_policy
    version: ">=1,<2"
events:
  activate: {slot: btn_3, value: 1}
states:
  pd_brake:
    manifest:
      label: 初始姿态
      index: 2
      group: Base
      icon: settings_backup_restore
routes:
  - {from: com.bxi.normal/normal, event: activate, to: pd_brake, transition: first_frame_switch}
  - {from: com.bxi.zero_torque/zero_torque, event: activate, to: pd_brake, transition: first_frame_switch}
  - {from: com.bxi.initial_pos/initial_pos, event: activate, to: pd_brake, transition: first_frame_switch}
