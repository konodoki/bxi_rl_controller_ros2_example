schema: 1
id: com.bxi.dance
version: 1.0.0
api: 1
entrypoint: plugin:create_mod
events:
  activate: {slot: btn_5, value: 1}
  toggle_pause: {slot: btn_9, value: 1}
states:
  dance:
    manifest:
      label: 跳舞
      index: 5
      group: Advanced
      icon: star_shine
      confirm: true
      confirm_message: 请确保机器人周围1米范围内没有障碍物
    params:
      start_frame: 100
routes:
  - {from: com.bxi.normal/normal, event: activate, to: dance, transition: soft_switch}
  - from: dance
    event: com.bxi.normal/activate
    to: com.bxi.normal/normal
    transition: {profile: dual_running_blend, duration: 1.0}
  - {from: dance, event: com.bxi.zero_torque/activate, to: com.bxi.zero_torque/zero_torque}
  - {from: dance, event: toggle_pause, action: toggle_pause}
